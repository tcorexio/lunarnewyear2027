<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>🧧 Đếm Ngược Tết Nguyên Đán 2027</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <canvas id="fx-canvas"></canvas>

    <div class="wrap">
      <div class="lanterns" aria-hidden="true">
        <span>🏮</span><span>🏮</span><span>🏮</span><span>🏮</span
        ><span>🏮</span>
      </div>

      <header class="header">
        <div class="blossom-title" aria-hidden="true">🌸🌼🌸</div>
        <h1>Đếm Ngược Đến Tết Đinh Mùi 2027</h1>
        <p class="subtitle">Mùng 1 Tết Nguyên Đán — Thứ Bảy, 06/02/2027</p>
      </header>

      <main class="countdown-box" id="countdown-box">
        <div class="unit">
          <div class="value" id="days">00</div>
          <div class="label">Ngày</div>
        </div>
        <div class="sep">:</div>
        <div class="unit">
          <div class="value" id="hours">00</div>
          <div class="label">Giờ</div>
        </div>
        <div class="sep">:</div>
        <div class="unit">
          <div class="value" id="minutes">00</div>
          <div class="label">Phút</div>
        </div>
        <div class="sep">:</div>
        <div class="unit">
          <div class="value" id="seconds">00</div>
          <div class="label">Giây</div>
        </div>
      </main>

      <div id="arrived-banner" class="arrived-banner hidden">
        🎉 CHÚC MỪNG NĂM MỚI ĐINH MÙI 2027 🎉
      </div>

      <section class="dates-card">
        <div class="date-item">
          <div class="date-icon">☀️</div>
          <div>
            <div class="date-label">Hôm nay (Dương lịch)</div>
            <div class="date-value" id="solar-date">—</div>
          </div>
        </div>
        <div class="divider"></div>
        <div class="date-item">
          <div class="date-icon">🌙</div>
          <div>
            <div class="date-label">Hôm nay (Âm lịch)</div>
            <div class="date-value" id="lunar-date">—</div>
          </div>
        </div>
      </section>

      <footer class="footer">
        <p>🎋 An khang thịnh vượng • Vạn sự như ý • Cung chúc tân xuân 🎋</p>
      </footer>
    </div>

    <script src="script.js"></script>
  </body>
</html>
